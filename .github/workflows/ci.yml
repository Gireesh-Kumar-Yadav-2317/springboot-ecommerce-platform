name: Ecommerece CI
on:
    push:
        branches:
            - main
            - feature/**
    pull_request:
        branches:
            - main
permissions:
    contents: read

concurrency:
    group: ecommerce-ci-${{github.workflow}}-${{github.ref}}

jobs:
    build-and-test:
        name: Build and Test
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Checkout source code
              uses: actions/checkout@v4

            - name: Set up Java 21
              uses: actions/setup-java@v5
              with:
                distribution: temurin
                java-version: "21"

            - name: verify Java and Maven wrapper
              run: | 
                java -version
                chmod +x mvnw
                ./mvnw --version

            - name: Compile,test and package 
              run: ./mvnw -B -ntp clean verify


